# ============================================================
# Render Blueprint - despliega backend y frontend desde GitHub
#   Render > New > Blueprint > elegir este repositorio
# Las variables con sync: false se piden en el panel al crear el Blueprint.
# ============================================================

services:
  # ---------- Backend FastAPI ----------
  - type: web
    name: vetcare-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Crea las tablas y los datos demo en Supabase solo si aún no existen.
    startCommand: python -m scripts.init_db --if-empty && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        sync: false # URI del Session pooler de Supabase
      - key: DATABASE_SSLMODE
        value: require
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        sync: false # URL del frontend, p. ej. https://vetcare-web.onrender.com

  # ---------- Frontend React (Vite) ----------
  - type: web
    name: vetcare-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # BrowserRouter: cualquier ruta debe servir index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # URL del backend + /api, p. ej. https://vetcare-api.onrender.com/api
